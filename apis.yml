aid: conformal-medical
name: Conformal Medical
description: 'Conformal Medical, Inc. is a Nashua, New Hampshire medical device company
  developing the CLAAS (Conformal Left Atrial Appendage Seal) and next-generation CLAAS
  AcuFORM left atrial appendage occlusion (LAAO) systems, foam-based implants intended
  to seal the left atrial appendage and reduce stroke risk in patients with non-valvular
  atrial fibrillation without requiring pre-procedure CT sizing. The company runs the
  CONFORM pivotal IDE trial and the GLACE study, and publishes a public marketing site
  segmented for patients, physicians and company/investor audiences. W. L. Gore & Associates
  completed its acquisition of Conformal Medical on 2026-02-19. Conformal Medical is
  a regulated medical device manufacturer, not a software vendor: it operates no developer
  program, publishes no public API, SDK, webhook or machine-readable specification, and
  its only software artifacts are clinical-trial companion mobile apps for enrolled sites.'
